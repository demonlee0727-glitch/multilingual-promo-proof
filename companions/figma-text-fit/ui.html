<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:13px/1.55 Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--figma-color-text,#262927);background:var(--figma-color-bg,#faf9f6)}h1{margin:0 0 6px;font-size:21px;letter-spacing:-.7px}p{margin:6px 0 14px}.sub,.hint{color:var(--figma-color-text-secondary,#656864)}.hint{font-size:11px;margin:4px 0 12px}#layer{border-left:3px solid #dd624d;padding:6px 10px;margin:12px 0;background:var(--figma-color-bg-secondary,#f1efe8);overflow-wrap:anywhere}label{display:block;font-weight:650}textarea{display:block;width:100%;height:105px;border:1px solid var(--figma-color-border,#b5b5ad);border-radius:7px;background:var(--figma-color-bg,#fff);color:inherit;padding:9px;font:12px/1.5 ui-monospace,monospace;resize:vertical}button{width:100%;border:0;border-radius:7px;padding:9px;background:var(--figma-color-bg-brand,#285540);color:var(--figma-color-text-onbrand,#fff);font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{margin:10px 0 4px}#results{padding:0;margin:0;list-style:none}li{padding:8px 0;border-bottom:1px solid var(--figma-color-border,#ddd)}.row{display:flex;justify-content:space-between;gap:8px}.copy{word-break:break-word;white-space:pre-wrap;color:var(--figma-color-text-secondary,#686963);font-size:12px}.warn{color:var(--figma-color-text-danger,#a13222)}
</style>
<h1>Poster text fit</h1><p class="sub">Measure each translation at the original font size and frame width.</p>
<div id="layer">Select one text layer on the canvas.</div>
<label for="copy">Approved localized copy</label>
<textarea id="copy" spellcheck="false" maxlength="16000">EN | All Accessories
DE | Auf das gesamte Zubehör
FR | Sur tous les accessoires
IT | Su tutti gli accessori
ES | En todos los accesorios</textarea>
<p class="hint">Paste up to 12 rows. Separate the locale and copy with a tab or |. Use \n for a line break.</p>
<button id="check" disabled>Check text fit</button>
<p id="status" role="status">Select a text layer to begin.</p><ul id="results"></ul>
<script>
const el = id => document.getElementById(id);
const input = el('copy'), button = el('check'), status = el('status'), list = el('results');
let layer = null, pending = false, revision = 0;
const post = message => parent.postMessage({pluginMessage: message}, '*');
const px = value => Number(value.toFixed(1)) + ' px';
function enable() {button.disabled = pending || !layer || !input.value.trim();}
function clearStatus(text) {list.replaceChildren(); status.textContent = text;}
input.addEventListener('input', () => {revision++; clearStatus('Copy changed. Run the check again.'); enable();});
button.onclick = () => {
  if (!layer || pending) return;
  pending = true; enable(); clearStatus('Measuring in the original font…');
  post({type:'check', id:layer.id, input:input.value, revision});
};
window.onmessage = event => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'selection') {
    const item = msg.info;
    if (!layer || !item || layer.id !== item.id || layer.height !== item.height || layer.width !== item.width) {
      revision++;
      clearStatus(item ? 'Ready to measure.' : 'Select a text layer to begin.');
    }
    layer = item;
    el('layer').textContent = item ? item.name + '　' + px(item.width) + ' × ' + px(item.height) : 'Select one text layer on the canvas.';
    enable(); return;
  }
  if (msg.type !== 'error' && msg.type !== 'result') return;
  pending = false; enable();
  if (msg.revision !== revision) return;
  if (msg.type === 'error') {clearStatus(msg.text); return;}
  if (!layer || msg.id !== layer.id) return;
  const count = msg.results.filter(row => row.extra > 0).length;
  clearStatus(msg.results.length + ' checked, ' + count + ' exceed the original height.');
  for (const row of msg.results) {
    const li = document.createElement('li'), head = document.createElement('div'), locale = document.createElement('strong'), metric = document.createElement('span'), copy = document.createElement('div');
    head.className = 'row'; copy.className = 'copy'; locale.textContent = row.locale;
    metric.textContent = row.extra ? 'Overflow: ' + row.extra + ' px · Required: ' + px(row.required) : 'Fits · Required: ' + px(row.required);
    if (row.extra) metric.className = 'warn';
    copy.textContent = row.copy; head.append(locale, metric); li.append(head, copy); list.append(li);
  }
};
post({type:'ready'});
</script></html>
